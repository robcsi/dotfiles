# instantWM configuration
# Only the keys set here override the built-in defaults.
# See: https://instantos.io/docs/wmsettings.html

# Session autostart (migrated from ~/.config/instantos/autostart.sh, 2026-09-10).
# exec_once = startup only; `exec` would re-run on every `instantwmctl reload`
# and spawn duplicates. `ins autostart` is the distro hook for instantOS's own
# session tasks, not for user apps.
# NOTE: instantWM's tray is StatusNotifierItem-only (no XEmbed), so tray applets
# must speak SNI/appindicator -- hence nm-applet's required --indicator flag.
exec_once = [
  "picom",
  "~/.digistorage-dist/storagegui",
  "solaar -w hide",
  "openfortigui",
  "nm-applet --indicator",
  "blueman-applet",
  "volumeicon",
  "env GTK_THEME=Adwaita:dark xfce4-power-manager --daemon",
]

[layout]
# Spacing between tiled windows (logical pixels)
inner_gap = 8
# Spacing between tiled windows and the monitor edge (logical pixels)
outer_gap = 8
# Keep gaps even when only one tiled window is present
smart_gaps = false
# Keep gaps in maximized-stack presentation (Super+W)
maximized_gaps = true

[systray]
# Pin the tray to one monitor. 0 = follow focused monitor, which scattered
# icons across both screens as apps registered at different times.
pinning = 1
